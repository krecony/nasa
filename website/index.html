<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earth Jukebox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@500;600&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #5b8fbd; }
  .hero { position: relative; width: 100%; height: 100vh; height: 100svh; min-height: 560px; overflow: hidden; background: #5b8fbd; touch-action: none; font-family: Inter, system-ui, sans-serif; }
  .hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .app { position: absolute; inset: 0; }
  .intro { position: relative; height: 100%; box-sizing: border-box; padding: 0 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 44px; text-align: center; }
  .hero h1 .word { display: inline-block; white-space: nowrap; }
  .hero h1 .ch { display: inline-block; will-change: transform, opacity; }
  .hero h1 { margin: 0; max-width: 12ch; font-family: 'Bricolage Grotesque', Inter, sans-serif; font-weight: 800; font-size: clamp(3.5rem, 10.5vw, 10.5rem); line-height: 0.9; letter-spacing: -0.04em; color: #F3EEE0; text-shadow: 0 2px 6px rgba(10,30,20,0.35), 0 8px 48px rgba(10,30,20,0.6); }
  .cta { display: inline-flex; align-items: center; gap: 12px; height: 60px; padding: 0 30px 0 34px; border: 0; border-radius: 999px; background: #F3EEE0; color: #10201F; font: 600 18px/1 Inter, system-ui, sans-serif; letter-spacing: -0.01em; text-decoration: none; cursor: pointer; box-shadow: 0 10px 30px rgba(4,12,16,0.35); transition: background-color .2s ease, transform .2s ease, box-shadow .2s ease; }
  .cta:hover { background: #fff; transform: translateY(-2px); box-shadow: 0 14px 36px rgba(4,12,16,0.45); }
  .cta:active { transform: translateY(0); }
  .cta svg { transition: transform .2s ease; }
  .cta:hover svg { transform: translateX(3px); }
  .snd { position: absolute; right: 24px; bottom: 24px; display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 18px 0 14px; border-radius: 999px; border: 1px solid rgba(243,238,224,0.28); background: rgba(11,24,32,0.55); color: #F3EEE0; font: 500 14px/1 Inter, system-ui, sans-serif; cursor: pointer; transition: background-color .2s ease, border-color .2s ease; }
  .snd:hover { background: rgba(11,24,32,0.8); border-color: rgba(243,238,224,0.5); }
  .snd .on { display: none; }
  .snd[aria-pressed="true"] .on { display: inline; }
  .snd[aria-pressed="true"] .off { display: none; }
  .cta:focus-visible, .snd:focus-visible { outline: 3px solid #F2B872; outline-offset: 4px; }
  .snd { z-index: 3; }

  /* ---------- the jukebox, lying in clearings in the forest ---------- */
  .stage { position: absolute; inset: 0; pointer-events: none; }
  /* invisible layout: where each clearing ends up on screen in the bird's-eye view */
  .layout { position: absolute; inset: 0; box-sizing: border-box; display: grid; visibility: hidden;
    grid-template-columns: minmax(170px, 15%) minmax(0, 1fr) minmax(220px, 24%);
    grid-template-areas: "tracks player info";
    gap: clamp(24px, 3.4vw, 60px);
    padding: clamp(24px, 5vh, 56px) clamp(24px, 3.4vw, 60px) clamp(80px, 10vh, 96px); }
  .slot-tracks { grid-area: tracks; } .slot-player { grid-area: player; } .slot-info { grid-area: info; }
  @media (max-width: 860px), (max-aspect-ratio: 1/1) {
    .layout { grid-template-columns: 1fr; grid-template-rows: minmax(0, 50fr) minmax(0, 18fr) minmax(0, 32fr);
      grid-template-areas: "player" "tracks" "info"; gap: 18px; padding: 18px 18px 80px; }
  }
  .panel { position: absolute; left: 0; top: 0; box-sizing: border-box; transform-origin: 0 0;
    opacity: 0; visibility: hidden; overflow: auto; overscroll-behavior: contain; touch-action: pan-y;
    pointer-events: auto; padding: clamp(14px, 1.5vw, 22px); border-radius: 22px;
    background: rgba(8, 22, 19, 0.88); color: #F3EEE0; font: 500 15px/1.5 Inter, system-ui, sans-serif;
    box-shadow: inset 0 0 0 1px rgba(243,238,224,0.10), inset 0 12px 34px rgba(0,0,0,0.6),
                0 0 0 7px rgba(52, 80, 38, 0.35), 0 26px 60px rgba(0,0,0,0.45);
    scrollbar-color: rgba(243,238,224,0.3) transparent; will-change: transform, opacity; }
  .panel h2, .panel h3 { font-family: 'Bricolage Grotesque', Inter, sans-serif; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 6px; }
  .panel h2 { font-size: clamp(1.25rem, 1.7vw, 1.7rem); line-height: 1.1; }
  .panel h3 { font-size: 1.05rem; margin-top: 14px; }
  .panel p, .panel ul { margin: 0 0 8px; }
  .panel :focus-visible { outline: 3px solid #F2B872; outline-offset: 3px; border-radius: 6px; }
  .panel-player { display: flex; flex-direction: column; gap: 10px; }
  .player-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .player-head .source { color: rgba(243,238,224,0.7); font-size: 13px; margin: 0; }
  .panel-player video { flex: 1 1 auto; min-height: 0; width: 100%; object-fit: contain; background: #000; border-radius: 12px; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
  .btn { font: 600 14px/1 Inter, system-ui, sans-serif; height: 40px; padding: 0 18px; border-radius: 999px; border: 0; cursor: pointer;
    background: #F3EEE0; color: #10201F; }
  .btn:hover { background: #fff; }
  .btn-ghost { background: transparent; color: #F3EEE0; border: 1px solid rgba(243,238,224,0.35); white-space: nowrap; }
  .btn-ghost:hover { background: rgba(243,238,224,0.1); }
  .toggle { color: rgba(243,238,224,0.8); font-size: 13px; display: inline-flex; gap: 8px; align-items: center; }
  .status { margin: 0; padding: 8px 12px; border-left: 3px solid #F2B872; background: rgba(243,238,224,0.06); border-radius: 4px; font-size: 14px; }
  .status:empty { display: none; }
  #track-list { list-style: none; padding: 0; margin: 8px 0 0; display: flex; flex-direction: column; gap: 8px; }
  #track-list button { width: 100%; text-align: left; font: 600 14px/1.3 Inter, system-ui, sans-serif; padding: 10px 14px; border-radius: 14px;
    border: 1px solid rgba(243,238,224,0.25); background: rgba(243,238,224,0.06); color: #F3EEE0; cursor: pointer; }
  #track-list button:hover { background: rgba(243,238,224,0.14); }
  #track-list button[aria-pressed="true"] { background: #F2B872; border-color: #F2B872; color: #10201F; }
  @media (max-width: 860px), (max-aspect-ratio: 1/1) {
    #track-list { flex-direction: row; flex-wrap: wrap; } #track-list button { width: auto; }
  }
  .panel-info ul { padding-left: 18px; } .panel-info li + li { margin-top: 4px; }
  .panel-info details { margin-top: 12px; } .panel-info summary { cursor: pointer; font-weight: 600; }
  .panel-info img { max-width: 100%; background: #fff; border-radius: 6px; margin-top: 8px; }
</style>
</head>
<body>
<div class="hero" id="hero">
  <canvas id="forest" aria-hidden="true"></canvas>
  <main class="app">
    <div class="intro" id="intro">
      <h1 id="title">Earth Jukebox</h1>
      <!-- Without WebGL (or JavaScript) this simply opens the jukebox page -->
      <a class="cta" href="index2.html">Check it out<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></a>
    </div>

    <!-- The jukebox: each panel lies in a clearing in the forest (see "clearings" in the script) -->
    <section class="stage" id="stage" aria-label="Earth Jukebox player" inert>
      <div class="layout" aria-hidden="true">
        <div class="slot-tracks" data-panel="tracks"></div>
        <div class="slot-player" data-panel="player"></div>
        <div class="slot-info" data-panel="info"></div>
      </div>

      <nav class="panel panel-tracks" id="panel-tracks" aria-labelledby="tracks-heading">
        <h2 id="tracks-heading">Tracks</h2>
        <ul id="track-list"></ul>
      </nav>

      <section class="panel panel-player" id="panel-player" aria-labelledby="track-title">
        <div class="player-head">
          <div>
            <h2 id="track-title" tabindex="-1">Loading…</h2>
            <p id="track-source" class="source"></p>
          </div>
          <button type="button" class="btn btn-ghost" id="back">Back to the forest</button>
        </div>
        <video id="video" controls loop playsinline preload="metadata" aria-describedby="description">
          <track id="captions" kind="captions" srclang="en" label="What you're hearing" default>
        </video>
        <div class="controls">
          <button type="button" class="btn" id="play" aria-pressed="false">Play</button>
          <label class="toggle"><input type="checkbox" id="announce" checked> Read the daily descriptions to screen readers</label>
        </div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </section>

      <section class="panel panel-info" id="panel-info" aria-label="About this track">
        <h3>What the picture shows</h3>
        <p id="description"></p>
        <h3>How to listen</h3>
        <ul id="guide"></ul>
        <details>
          <summary>How the sound is made</summary>
          <p>A Python script reads every frame of the video, turns the colors back into numbers with the map's own color bar, and turns those numbers into music.</p>
          <img id="features-image" alt="Graphs of the numbers extracted from the video over time.">
        </details>
      </section>
    </section>
  </main>
  <button type="button" class="snd" id="sound" aria-pressed="false">
    <svg class="on" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    <svg class="off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M22 9l-6 6"/><path d="M16 9l6 6"/></svg>
    <span>Sound off</span>
  </button>
</div>

<script>
(function () {
  // ---- Settings you can change ----
  var opts = {
    treeCount: 4500,   // fewer = smoother on slow computers
    windStrength: 1,   // 0.2 - 2.5
    volume: 0.5,       // 0 - 1
    transition: 2.6,   // seconds for the camera to swing up to the bird's-eye view
    topHeight: 78      // how high the bird's-eye camera flies (higher = smaller-looking trees)
  };

  function startForest(canvas, opts) {
    const gl = canvas.getContext('webgl2', { antialias: true, alpha: false, powerPreference: 'high-performance' });
    if (!gl) return { supported: false, stop() {}, setSound() {}, hoverSound() {}, setLayout() {}, go() {}, duck() {}, gust() {} };
    const root = canvas.parentElement || canvas;
    const reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

    // ---------- seeded random ----------
    let seed = 20261114;
    const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
    const rr = (a, b) => a + (b - a) * rnd();
    const hex = (h) => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];

    // ---------- low-poly tree template (height 0..1) ----------
    const V = [];
    const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
    const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
    const nrm = (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
    const put = (arr, p, n, c, leaf) => { arr.push(p[0], p[1], p[2], n[0], n[1], n[2], c[0], c[1], c[2], leaf); };
    const tri = (arr, a, b, c, col, leaf, hint) => {
      let n = nrm(cross(sub(b, a), sub(c, a)));
      if (n[0] * hint[0] + n[1] * hint[1] + n[2] * hint[2] < 0) n = [-n[0], -n[1], -n[2]];
      put(arr, a, n, col, leaf); put(arr, b, n, col, leaf); put(arr, c, n, col, leaf);
    };

    const bark = hex('#3a2c22');
    const TS = 5;
    for (let i = 0; i < TS; i++) {
      const a0 = (i / TS) * Math.PI * 2, a1 = ((i + 1) / TS) * Math.PI * 2, am = (a0 + a1) / 2;
      const p0 = [Math.cos(a0) * 0.045, 0, Math.sin(a0) * 0.045];
      const p1 = [Math.cos(a1) * 0.045, 0, Math.sin(a1) * 0.045];
      const q0 = [Math.cos(a0) * 0.028, 0.42, Math.sin(a0) * 0.028];
      const q1 = [Math.cos(a1) * 0.028, 0.42, Math.sin(a1) * 0.028];
      const hint = [Math.cos(am), 0, Math.sin(am)];
      tri(V, p0, p1, q1, bark, 0, hint);
      tri(V, p0, q1, q0, bark, 0, hint);
    }
    const layers = [
      { b: 0.15, t: 0.62, r: 0.36, col: '#2e6a2b' },
      { b: 0.36, t: 0.82, r: 0.27, col: '#387b32' },
      { b: 0.57, t: 1.0, r: 0.18, col: '#438c3a' }
    ];
    layers.forEach((L, li) => {
      const N = 7;
      const col = hex(L.col);
      const under = col.map((v) => v * 0.55);
      const ring = [];
      for (let i = 0; i < N; i++) {
        const a = (i / N) * Math.PI * 2 + li * 0.45;
        const r = L.r * rr(0.86, 1.12);
        ring.push([Math.cos(a) * r, L.b - rr(0.0, 0.045), Math.sin(a) * r]);
      }
      const apex = [rr(-0.012, 0.012), L.t, rr(-0.012, 0.012)];
      const center = [0, L.b + 0.07, 0];
      for (let i = 0; i < N; i++) {
        const A = ring[i], B = ring[(i + 1) % N];
        tri(V, A, B, apex, col, 1, [(A[0] + B[0]) / 2, 0.3, (A[2] + B[2]) / 2]);
        tri(V, center, B, A, under, 1, [0, -1, 0]);
      }
    });
    const treeVerts = V.length / 10;

    // ---------- a small glade under the headline ----------
    const GX = 0, GZ = -40;
    const inGlade = (x, z, grow) => {
      const a = Math.atan2(z - GZ, x - GX);
      const edge = 1 + 0.16 * Math.sin(a * 3 + 1.3) + 0.08 * Math.sin(a * 7);
      const ex = (x - GX) / 13, ez = (z - GZ) / 9.5;
      return Math.sqrt(ex * ex + ez * ez) < edge * grow;
    };

    // ---------- trees (spatial grid for spacing) ----------
    const count = Math.max(100, Math.min(8000, Math.round(opts.treeCount || 4500)));
    const trees = [];
    const cell = 3, grid = new Map();
    const key = (ix, iz) => ix * 100003 + iz;
    let tries = 0;
    while (trees.length < count && tries < count * 40) {
      tries++;
      const z = 18 - Math.pow(rnd(), 1.25) * 190;
      const depth = 30 - z;
      const halfW = 18 + depth * 1.1;
      const x = rr(-halfW, halfW);
      if (inGlade(x, z, 1.08)) continue;
      const minD = 1.4 + depth * 0.005;
      const ix = Math.floor(x / cell), iz = Math.floor(z / cell);
      let ok = true;
      for (let gx = ix - 1; gx <= ix + 1 && ok; gx++) {
        for (let gz = iz - 1; gz <= iz + 1 && ok; gz++) {
          const list = grid.get(key(gx, gz));
          if (!list) continue;
          for (let i = 0; i < list.length; i++) {
            const dx = list[i].x - x, dz = list[i].z - z;
            if (dx * dx + dz * dz < minD * minD) { ok = false; break; }
          }
        }
      }
      if (!ok) continue;
      const H = rr(7, 15);
      const warm = rnd() < 0.06;
      const t = {
        x, z, H,
        W: H * rr(0.36, 0.5),
        rot: rr(0, Math.PI * 2),
        tint: warm ? [rr(1.25, 1.45), rr(1.05, 1.2), rr(0.6, 0.75)] : [rr(0.82, 1.1), rr(0.9, 1.15), rr(0.72, 1.0)],
        phase: rr(0, 100),
        k: rr(9, 15),
        c: rr(1.5, 2.3),
        lx: 0.06 + rr(-0.045, 0.05),
        lz: -0.02 + rr(-0.03, 0.03),
        bx: 0, bz: 0, vx: 0, vz: 0, ag: 0.1, rust: 0, sx: 0.5
      };
      trees.push(t);
      const k2 = key(ix, iz);
      if (!grid.has(k2)) grid.set(k2, []);
      grid.get(k2).push(t);
    }
    const NT = trees.length;
    // trees further away sound quieter
    trees.forEach((t) => { t.bx = t.lx; t.bz = t.lz; t.near = Math.pow(Math.max(0.04, 1 - (30 - t.z - 15) / 170), 1.8); t.clear = false; t.cd = rnd(); });

    // ---------- shaders ----------
    const VS = `#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aNor;
layout(location=2) in vec3 aCol;
layout(location=3) in float aLeaf;
layout(location=4) in vec4 iTr;
layout(location=5) in vec4 iTint;
layout(location=6) in vec4 iBend;
uniform mat4 uVP;
uniform float uTime;
uniform float uFlutter;
out vec3 vCol; out vec3 vNor; out vec3 vWorld; out float vLeaf; out float vH;
void main(){
  float c = cos(iTint.w), s = sin(iTint.w);
  vec3 p = aPos;
  p.xz = vec2(c*p.x - s*p.z, s*p.x + c*p.z);
  vec3 n = aNor;
  n.xz = vec2(c*n.x - s*n.z, s*n.x + c*n.z);
  float h = clamp(p.y, 0.0, 1.0);
  float ag = iBend.z * uFlutter;
  vec3 fl = vec3(
    sin(uTime*14.0 + iBend.w + p.y*23.0 + p.x*31.0),
    sin(uTime*11.0 + iBend.w*1.7 + p.z*29.0 + p.y*13.0)*0.6,
    cos(uTime*12.5 + iBend.w*0.6 + p.y*19.0 + p.z*27.0));
  p += fl * aLeaf * ag * 0.03 * (0.3 + h);
  vec3 w = vec3(p.x*iTr.w, p.y*iTr.z, p.z*iTr.w);
  vec2 b = iBend.xy * (h*h) * iTr.z;
  w.xz += b;
  w.y -= 0.5 * dot(b, b) / iTr.z * h;
  w.x += iTr.x; w.z += iTr.y;
  vNor = normalize(n);
  vCol = mix(aCol, aCol * iTint.rgb, aLeaf);
  vWorld = w; vLeaf = aLeaf; vH = h;
  gl_Position = uVP * vec4(w, 1.0);
}`;
    const FS = `#version 300 es
precision highp float;
in vec3 vCol; in vec3 vNor; in vec3 vWorld; in float vLeaf; in float vH;
uniform vec3 uEye; uniform vec3 uFog; uniform vec3 uSkyTop; uniform vec3 uSun; uniform vec3 uSunCol; uniform float uFogK;
out vec4 o;
void main(){
  vec3 n = normalize(vNor);
  float diff = max(dot(n, uSun), 0.0);
  vec3 amb = mix(vec3(0.16, 0.18, 0.14), vec3(0.40, 0.48, 0.58), n.y*0.5 + 0.5);
  vec3 v = normalize(uEye - vWorld);
  float rim = pow(1.0 - max(dot(n, v), 0.0), 3.0) * 0.2;
  vec3 col = vCol * (amb + diff*uSunCol) + rim * uSunCol * vCol;
  col *= mix(0.7, 1.0, smoothstep(0.0, 0.55, vH + (1.0 - vLeaf)*0.3));
  float d = length(vWorld - uEye);
  float f = 1.0 - exp(-pow(d*0.0062*uFogK, 1.5));
  f *= mix(1.0, 0.85, clamp(vWorld.y/30.0, 0.0, 1.0));
  vec3 fogc = uFog;
  col = mix(col, fogc, clamp(f, 0.0, 1.0));
  o = vec4(col, 1.0);
}`;
    const SKY_VS = `#version 300 es
layout(location=0) in vec2 aP;
void main(){ gl_Position = vec4(aP, 0.0, 1.0); }`;
    const SKY_FS = `#version 300 es
precision highp float;
uniform vec2 uRes; uniform float uHorizon; uniform vec3 uFog; uniform vec3 uSkyTop; uniform vec3 uSunCol;
out vec4 o;
void main(){
  vec2 uv = gl_FragCoord.xy / uRes;
  float y = uv.y;
  float t = clamp((y - uHorizon) / max(1.0 - uHorizon, 0.001), 0.0, 1.0);
  vec3 col = mix(uFog, uSkyTop, pow(t, 0.7));
  float asp = uRes.x / uRes.y;
  float sd = distance(uv * vec2(asp, 1.0), vec2(0.86 * asp, 1.08));
  col += vec3(1.0, 0.93, 0.74) * (0.32 * exp(-sd * 4.0) + 0.38 * exp(-sd * 14.0));
  float nse = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453);
  col += (nse - 0.5) / 255.0;
  o = vec4(col, 1.0);
}`;

    const compile = (type, src) => {
      const s = gl.createShader(type);
      gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.warn(gl.getShaderInfoLog(s));
      return s;
    };
    const program = (vs, fs) => {
      const p = gl.createProgram();
      gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
      gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
      gl.linkProgram(p);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.warn(gl.getProgramInfoLog(p));
      return p;
    };
    const prog = program(VS, FS);
    const sky = program(SKY_VS, SKY_FS);
    const U = {};
    ['uVP', 'uTime', 'uFlutter', 'uEye', 'uFog', 'uSkyTop', 'uSun', 'uSunCol', 'uFogK'].forEach((n) => { U[n] = gl.getUniformLocation(prog, n); });
    const SU = {};
    ['uRes', 'uHorizon', 'uFog', 'uSkyTop', 'uSunCol'].forEach((n) => { SU[n] = gl.getUniformLocation(sky, n); });

    // ---------- buffers ----------
    const setupMesh = (data) => {
      const b = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, b);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(data), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 40, 0);
      gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 40, 12);
      gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 3, gl.FLOAT, false, 40, 24);
      gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3, 1, gl.FLOAT, false, 40, 36);
    };

    const treeVao = gl.createVertexArray();
    gl.bindVertexArray(treeVao);
    setupMesh(V);
    const inst = new Float32Array(NT * 8);
    trees.forEach((t, i) => { inst.set([t.x, t.z, t.H, t.W, t.tint[0], t.tint[1], t.tint[2], t.rot], i * 8); });
    const instBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
    gl.bufferData(gl.ARRAY_BUFFER, inst, gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(4); gl.vertexAttribPointer(4, 4, gl.FLOAT, false, 32, 0); gl.vertexAttribDivisor(4, 1);
    gl.enableVertexAttribArray(5); gl.vertexAttribPointer(5, 4, gl.FLOAT, false, 32, 16); gl.vertexAttribDivisor(5, 1);
    const bend = new Float32Array(NT * 4);
    const bendBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, bendBuf);
    gl.bufferData(gl.ARRAY_BUFFER, bend.byteLength, gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(6); gl.vertexAttribPointer(6, 4, gl.FLOAT, false, 16, 0); gl.vertexAttribDivisor(6, 1);
    gl.bindVertexArray(null);

    // low-poly ground: a grid of flat-coloured triangles, lighter meadow in the glade
    const G = [];
    const moss = ['#324e26', '#385629', '#2e4824', '#3d5c2c'].map(hex);
    const meadow = ['#67833a', '#6f8c40', '#5f7b36'].map(hex);
    const up = [0, 1, 0];
    const GS = 6;
    for (let gx = -300; gx < 300; gx += GS) {
      for (let gz = -240; gz < 40; gz += GS) {
        const a = [gx, 0, gz], b = [gx + GS, 0, gz], c = [gx + GS, 0, gz + GS], d = [gx, 0, gz + GS];
        const pick = (cx, cz) => {
          const m = inGlade(cx, cz, 1.0);
          const pal = m ? meadow : moss;
          return pal[Math.floor(rnd() * pal.length)];
        };
        const c1 = pick(gx + GS * 0.66, gz + GS * 0.33), c2 = pick(gx + GS * 0.33, gz + GS * 0.66);
        put(G, a, up, c1, 0); put(G, b, up, c1, 0); put(G, c, up, c1, 0);
        put(G, a, up, c2, 0); put(G, c, up, c2, 0); put(G, d, up, c2, 0);
      }
    }
    const groundVerts = G.length / 10;
    const groundVao = gl.createVertexArray();
    gl.bindVertexArray(groundVao);
    setupMesh(G);
    gl.bindVertexArray(null);

    const skyVao = gl.createVertexArray();
    gl.bindVertexArray(skyVao);
    const sb = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, sb);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 8, 0);
    gl.bindVertexArray(null);

    // ---------- camera math ----------
    const perspective = (fovy, aspect, near, far) => {
      const f = 1 / Math.tan(fovy / 2);
      return [f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (far + near) / (near - far), -1, 0, 0, (2 * far * near) / (near - far), 0];
    };
    const lookAt = (e, c, upv) => {
      const z = nrm(sub(e, c));
      const x = nrm(cross(upv, z));
      const y = cross(z, x);
      return [x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0,
        -(x[0] * e[0] + x[1] * e[1] + x[2] * e[2]), -(y[0] * e[0] + y[1] * e[1] + y[2] * e[2]), -(z[0] * e[0] + z[1] * e[1] + z[2] * e[2]), 1];
    };
    const mul = (a, b) => {
      const o = new Float32Array(16);
      for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
        let s = 0;
        for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k];
        o[c * 4 + r] = s;
      }
      return o;
    };

    // ---------- sound: synthesised leaf rustle + wind whoosh ----------
    let audio = null;
    let soundOn = false;
    let duckK = 1;   // turned down while a jukebox video is playing
    const vol = () => Math.max(0, Math.min(1, opts.volume ?? 0.5)) * duckK;
    const initAudio = () => {
      if (audio) { if (audio.ctx.state === 'suspended') audio.ctx.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const ctx = new AC();
      const len = ctx.sampleRate * 3;
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = buf.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0;
      for (let i = 0; i < len; i++) {
        const w = Math.random() * 2 - 1;
        b0 = 0.99765 * b0 + w * 0.0990460;
        b1 = 0.96300 * b1 + w * 0.2965164;
        b2 = 0.57000 * b2 + w * 1.0526913;
        data[i] = (b0 + b1 + b2 + w * 0.1848) * 0.2;
      }
      const noise = (rate) => {
        const s = ctx.createBufferSource();
        s.buffer = buf; s.loop = true; s.playbackRate.value = rate;
        s.start(0, Math.random() * 2.5);
        return s;
      };
      const master = ctx.createGain(); master.gain.value = 0;
      const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
      if (pan) { pan.connect(master); }
      master.connect(ctx.destination);
      const out = pan || master;

      // leaves: soft, mid-range rustle (no harsh hiss)
      const leafHP = ctx.createBiquadFilter(); leafHP.type = 'highpass'; leafHP.frequency.value = 450;
      const leafBP = ctx.createBiquadFilter(); leafBP.type = 'bandpass'; leafBP.frequency.value = 1500; leafBP.Q.value = 0.45;
      const leafLP = ctx.createBiquadFilter(); leafLP.type = 'lowpass'; leafLP.frequency.value = 3800; leafLP.Q.value = 0.5;
      const leafG = ctx.createGain(); leafG.gain.value = 0;
      noise(0.85).connect(leafHP); leafHP.connect(leafBP); leafBP.connect(leafLP); leafLP.connect(leafG); leafG.connect(out);

      // whoosh: dark, follows the speed of the cursor
      const whooshLP = ctx.createBiquadFilter(); whooshLP.type = 'lowpass'; whooshLP.frequency.value = 400; whooshLP.Q.value = 0.5;
      const whooshG = ctx.createGain(); whooshG.gain.value = 0;
      noise(0.5).connect(whooshLP); whooshLP.connect(whooshG); whooshG.connect(out);

      // very quiet ambient wind bed
      const bedLP = ctx.createBiquadFilter(); bedLP.type = 'lowpass'; bedLP.frequency.value = 280;
      const bedG = ctx.createGain(); bedG.gain.value = 0.025;
      noise(0.4).connect(bedLP); bedLP.connect(bedG); bedG.connect(master);

      audio = { ctx, master, pan, leafG, leafBP, whooshG, whooshLP, bedG, flick: 1 };
    };
    const setSound = (on) => {
      soundOn = on;
      if (on) initAudio();
      if (audio) audio.master.gain.setTargetAtTime(on ? vol() : 0, audio.ctx.currentTime, 0.15);
    };

    // ---------- state ----------
    const FOG = hex('#9dbcd3'), SKYTOP = hex('#2766a6');
    const SUN = nrm([0.55, 0.75, 0.35]);
    const SUNCOL = [0.88, 0.81, 0.68];
    let cw = 1, ch = 1, dpr = 1;
    const cam = { x: 0, y: 0 };
    const pointer = { nx: 0, ny: 0, speed: 0 };
    const puffs = [];
    let last = null;
    let raf = 0, prev = performance.now(), time = 0;
    const scr = new Float32Array(6);

    // ---------- transition: 0 = home view, 1 = bird's-eye view ----------
    const view = { t: 0, to: 0, wait: 0, dur: 1, moving: false };
    let arrived = null;
    const easeIO = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
    const smooth = (a, b, x) => { const u = Math.min(1, Math.max(0, (x - a) / (b - a))); return u * u * (3 - 2 * u); };
    const TOP_FOV = 50 * Math.PI / 180;
    const EL0 = Math.atan2(30, 70), DIST0 = Math.hypot(30, 70);   // the home camera, seen from the glade
    let gustT = -1;
    let lastE = -1, clearDirty = true;
    const panels = [];   // { el, rect: {x, y, w, h} on screen at the end, world: {x0, z0, x1, z1} }
    const corners = new Float32Array(8);

    // screen position in the final bird's-eye view -> spot on the ground
    const toGround = (sx, sy) => {
      const halfH = opts.topHeight * Math.tan(TOP_FOV / 2), halfW = halfH * (cw / ch);
      return [GX + (sx / cw * 2 - 1) * halfW, GZ - (1 - sy / ch * 2) * halfH];
    };
    const setLayout = (list) => {
      resize();
      panels.length = 0;
      list.forEach((p) => {
        const a = toGround(p.rect.x, p.rect.y), b = toGround(p.rect.x + p.rect.w, p.rect.y + p.rect.h);
        panels.push({ el: p.el, rect: p.rect, world: { x0: a[0], z0: a[1], x1: b[0], z1: b[1] }, shown: null });
      });
      // trees whose crown touches a clearing get blown away during the transition
      for (let i = 0; i < NT; i++) {
        const t = trees[i], r = t.W * 0.42 + 0.6;
        t.clear = panels.some((p) => {
          const dx = Math.max(p.world.x0 - t.x, 0, t.x - p.world.x1), dz = Math.max(p.world.z0 - t.z, 0, t.z - p.world.z1);
          return dx * dx + dz * dz < r * r;
        });
      }
      clearDirty = true;
    };
    const go = (target, o) => {
      o = o || {};
      view.to = target;
      view.wait = o.wait || 0;
      view.dur = Math.max(o.dur != null ? o.dur : (opts.transition || 2.6), 0.0001);
      if (o.instant) { view.t = target; view.wait = 0; }
      view.moving = true;
    };
    // a gust of wind sweeping across the screen, left to right
    const gust = () => { gustT = 0; };

    // CSS matrix that lays a w x h box onto 4 screen points (top-left, top-right, bottom-right, bottom-left)
    const quadMatrix = (w, h, q) => {
      const x0 = q[0], y0 = q[1], x1 = q[2], y1 = q[3], x2 = q[4], y2 = q[5], x3 = q[6], y3 = q[7];
      const sx = x0 - x1 + x2 - x3, sy = y0 - y1 + y2 - y3;
      let a, b, c, d, e, f, g, k;
      if (Math.abs(sx) < 1e-6 && Math.abs(sy) < 1e-6) { a = x1 - x0; b = x2 - x1; c = x0; d = y1 - y0; e = y2 - y1; f = y0; g = 0; k = 0; }
      else {
        const dx1 = x1 - x2, dx2 = x3 - x2, dy1 = y1 - y2, dy2 = y3 - y2;
        const den = dx1 * dy2 - dx2 * dy1 || 1e-9;
        g = (sx * dy2 - dx2 * sy) / den; k = (dx1 * sy - sx * dy1) / den;
        a = x1 - x0 + g * x1; b = x3 - x0 + k * x3; c = x0;
        d = y1 - y0 + g * y1; e = y3 - y0 + k * y3; f = y0;
      }
      a /= w; d /= w; g /= w; b /= h; e /= h; k /= h;
      return 'matrix3d(' + [a, d, 0, g, b, e, 0, k, 0, 0, 1, 0, c, f, 0, 1].join(',') + ')';
    };
    const projectTo = (m, x, y, z, out, o) => {
      const w = m[3] * x + m[7] * y + m[11] * z + m[15];
      if (w <= 0.01) return false;
      out[o] = ((m[0] * x + m[4] * y + m[8] * z + m[12]) / w * 0.5 + 0.5) * cw;
      out[o + 1] = (0.5 - (m[1] * x + m[5] * y + m[9] * z + m[13]) / w * 0.5) * ch;
      return true;
    };
    const updatePanels = (VP, e) => {
      const op = smooth(0.3, 0.8, e);
      for (const p of panels) {
        const st = p.el.style;
        if (op <= 0.001) {
          if (p.shown !== false) { st.opacity = '0'; st.visibility = 'hidden'; p.shown = false; }
          continue;
        }
        st.width = p.rect.w + 'px'; st.height = p.rect.h + 'px';
        if (e >= 0.9999) {
          st.transform = 'translate(' + p.rect.x + 'px,' + p.rect.y + 'px)';
        } else {
          const W = p.world;
          const ok = projectTo(VP, W.x0, 0, W.z0, corners, 0) && projectTo(VP, W.x1, 0, W.z0, corners, 2) &&
                     projectTo(VP, W.x1, 0, W.z1, corners, 4) && projectTo(VP, W.x0, 0, W.z1, corners, 6);
          if (!ok) { st.visibility = 'hidden'; p.shown = false; continue; }
          st.transform = quadMatrix(p.rect.w, p.rect.h, corners);
        }
        st.opacity = op.toFixed(3); st.visibility = 'visible'; p.shown = true;
      }
    };

    const resize = () => {
      const w = canvas.clientWidth || 1, h = canvas.clientHeight || 1;
      const d = Math.min(window.devicePixelRatio || 1, 2);
      if (w !== cw || h !== ch || d !== dpr) {
        cw = w; ch = h; dpr = d;
        canvas.width = Math.round(w * d);
        canvas.height = Math.round(h * d);
      }
    };

    const onMove = (e) => {
      if (e.target && e.target.closest && e.target.closest('.panel')) { last = null; return; }
      const rect = canvas.getBoundingClientRect();
      const sc = (canvas.clientWidth || 1) / (rect.width || 1);
      const x = (e.clientX - rect.left) * sc, y = (e.clientY - rect.top) * sc;
      pointer.nx = (x / cw) * 2 - 1;
      pointer.ny = (y / ch) * 2 - 1;
      const now = performance.now();
      if (last) {
        const dx = x - last.x, dy = y - last.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 2) return;
        const dts = Math.max((now - last.t) / 1000, 1 / 240);
        const spd = Math.min(dist / dts, 4000);
        pointer.speed = Math.max(pointer.speed, spd);
        const f = Math.min(spd / 600, 1.6);
        puffs.push({ x, y, vx: dx * f, vy: dy * f, ux: dx / dist, uy: dy / dist, spd, r: 12 + Math.min(spd * 0.006, 10), life: 1 });
        if (puffs.length > 90) puffs.shift();
      }
      last = { x, y, t: now };
    };
    const onLeave = () => { last = null; };
    root.addEventListener('pointermove', onMove);
    root.addEventListener('pointerleave', onLeave);
    root.addEventListener('pointercancel', onLeave);

    const segDist = (px, py, ax, ay, bx, by) => {
      const vx = bx - ax, vy = by - ay;
      const l2 = vx * vx + vy * vy || 1;
      let t = ((px - ax) * vx + (py - ay) * vy) / l2;
      t = t < 0 ? 0 : t > 1 ? 1 : t;
      const dx = px - (ax + vx * t), dy = py - (ay + vy * t);
      return Math.sqrt(dx * dx + dy * dy);
    };
    const project = (m, x, y, z, o) => {
      const w = m[3] * x + m[7] * y + m[11] * z + m[15];
      if (w <= 0.01) return false;
      scr[o] = ((m[0] * x + m[4] * y + m[8] * z + m[12]) / w * 0.5 + 0.5) * cw;
      scr[o + 1] = (0.5 - (m[1] * x + m[5] * y + m[9] * z + m[13]) / w * 0.5) * ch;
      return true;
    };

    const frame = (now) => {
      raf = requestAnimationFrame(frame);
      const rawDt = Math.min(Math.max((now - prev) / 1000, 0), 0.25);   // real time, for the transition
      const dt = Math.min(rawDt, 1 / 30);
      prev = now;
      time += dt;
      resize();

      // high camera looking down over the forest, with gentle parallax
      // advance the transition
      if (view.moving) {
        if (view.wait > 0) view.wait -= rawDt;
        else {
          const step = rawDt / view.dur;
          view.t = view.t < view.to ? Math.min(view.to, view.t + step) : Math.max(view.to, view.t - step);
          if (view.t === view.to) { view.moving = false; arrived = view.to; }
        }
      }
      const e = easeIO(view.t);
      const k = 1 - e;   // pointer parallax fades out in the bird's-eye view

      const ease = Math.min(1, dt * 2);
      cam.x += (pointer.nx - cam.x) * ease;
      cam.y += (pointer.ny - cam.y) * ease;
      const aspect = cw / ch;
      // orbit up around the glade: from the low home angle to straight down
      const el = EL0 + (Math.PI / 2 - EL0) * e;
      const dist = DIST0 + (opts.topHeight - DIST0) * e;
      const target = [cam.x * 0.5 * k, 0, GZ];
      const eye = [target[0] + cam.x * 1.1 * k, dist * Math.sin(el) - cam.y * k, GZ + dist * Math.cos(el)];
      const upv = [0, Math.cos(el), -Math.sin(el)];
      const fov0 = (aspect < 1 ? 66 : 50) * Math.PI / 180;
      const fov = fov0 + (TOP_FOV - fov0) * e;
      const VP = mul(perspective(fov, aspect, 0.5, 700), lookAt(eye, target, upv));
      let horizon = 1.2;
      if (project(VP, eye[0], 0, eye[2] - 3000, 0)) horizon = 1 - scr[1] / ch;

      if (gustT >= 0) {
        gustT += rawDt;
        const g = gustT / 0.9;
        if (g < 1) {
          const xs = g * cw * 1.3 - cw * 0.15;
          for (let n = 0; n < 4; n++) {
            puffs.push({ x: xs + (Math.random() - 0.5) * 80, y: (0.15 + Math.random() * 0.85) * ch, vx: 700, vy: -70,
                         ux: 0.99, uy: -0.1, spd: 1800, r: 70, life: 1 });
          }
          if (puffs.length > 90) puffs.splice(0, puffs.length - 90);
          pointer.speed = Math.max(pointer.speed, 2600);
        } else gustT = -1;
      }

      for (let i = puffs.length - 1; i >= 0; i--) {
        const p = puffs[i];
        p.life -= dt * 7;
        if (p.life <= 0) { puffs.splice(i, 1); continue; }
        p.r += dt * 10;
        p.x += p.ux * p.spd * 0.04 * dt * p.life;
        p.y += p.uy * p.spd * 0.04 * dt * p.life;
      }
      pointer.speed *= Math.exp(-dt * 4);

      const K = 0.2 * (opts.windStrength ?? 1);
      const gdx = 0.97, gdz = -0.24;
      let rustSum = 0, rustX = 0;
      for (let i = 0; i < NT; i++) {
        const t = trees[i];
        let fx = 0, fy = 0;
        if (puffs.length && project(VP, t.x, 0, t.z, 0) && project(VP, t.x + t.bx * t.H, t.H * 0.95, t.z + t.bz * t.H, 2) && project(VP, t.x + 0.34 * t.W, t.H * 0.45, t.z, 4)) {
          t.sx = scr[0] / cw;
          const midX = (scr[0] + scr[2]) / 2, midY = (scr[1] + scr[3]) / 2;
          const crown = Math.hypot(scr[4] - midX, scr[5] - midY) * 0.25;
          for (let j = 0; j < puffs.length; j++) {
            const p = puffs[j];
            let d = segDist(p.x, p.y, scr[0], scr[1], scr[2], scr[3]) - crown;
            if (d < 0) d = 0;
            const q = d / p.r;
            if (q > 2) continue;
            const fall = Math.exp(-q * q) * p.life;
            fx += p.vx * fall;
            fy += p.vy * fall;
          }
        }
        let Fx = fx * K, Fz = fy * K;
        if (t.clear && e > 0.02 && e < 0.85) Fx += 6 * (opts.windStrength ?? 1);   // blown out of the clearing
        const fm = Math.hypot(Fx, Fz);
        if (fm > 22) { Fx *= 22 / fm; Fz *= 22 / fm; }

        const g = (reduce ? 0.015 : 0.03) + (reduce ? 0.02 : 0.07) * Math.pow(0.5 + 0.5 * Math.sin(time * 0.65 - t.x * 0.08 + t.z * 0.05 + t.phase * 0.05), 4);
        const tx = t.lx + g * gdx, tz = t.lz + g * gdz;
        t.vx += (t.k * (tx - t.bx) - t.c * t.vx + Fx) * dt;
        t.vz += (t.k * (tz - t.bz) - t.c * t.vz + Fz) * dt;
        t.bx += t.vx * dt;
        t.bz += t.vz * dt;
        const bm = Math.hypot(t.bx, t.bz);
        if (bm > 0.5) { t.bx *= 0.5 / bm; t.bz *= 0.5 / bm; t.vx *= 0.6; t.vz *= 0.6; }

        const target = Math.min(1, 0.12 + fm * 0.12 + Math.hypot(t.vx, t.vz) * 1.2 + g * 2);
        t.ag += (target - t.ag) * Math.min(1, dt * (target > t.ag ? 10 : 1.8));

        t.rust = Math.max(t.rust * Math.exp(-dt * 9), Math.min(1, fm * 0.08));
        if (t.rust > 0.01) { const w = t.rust * t.near; rustSum += w; rustX += w * t.sx; }

        bend[i * 4] = t.bx;
        bend[i * 4 + 1] = t.bz;
        bend[i * 4 + 2] = t.ag;
        bend[i * 4 + 3] = t.phase;
      }

      // shrink the trees that stand in a clearing
      if (clearDirty || Math.abs(e - lastE) > 1e-4) {
        for (let i = 0; i < NT; i++) {
          const t = trees[i];
          const s = t.clear ? 1 - smooth(0.08 + t.cd * 0.25, 0.5 + t.cd * 0.25, e) : 1;
          inst[i * 8 + 2] = t.H * s;
          inst[i * 8 + 3] = t.W * s;
        }
        gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
        gl.bufferSubData(gl.ARRAY_BUFFER, 0, inst);
        lastE = e; clearDirty = false;
      }

      // drive the sound from how much of the forest is being stirred
      if (audio && soundOn) {
        const at = audio.ctx.currentTime;
        const inten = 1 - Math.exp(-rustSum / 8);
        // slow, gentle wobble instead of per-frame crackle
        audio.flick += (0.7 + Math.random() * 0.6 - audio.flick) * 0.08;
        const leaf = inten * 0.26 * audio.flick;
        audio.leafG.gain.setTargetAtTime(leaf, at, 0.09);
        audio.leafBP.frequency.setTargetAtTime(1300 + inten * 900, at, 0.25);
        const sp = Math.min(1, pointer.speed / 3000) * Math.min(1, inten * 3);
        audio.whooshG.gain.setTargetAtTime(sp * 0.18, at, 0.15);
        audio.whooshLP.frequency.setTargetAtTime(320 + sp * 500, at, 0.2);
        audio.bedG.gain.setTargetAtTime(0.02 + 0.012 * Math.sin(time * 0.65), at, 0.5);
        if (audio.pan && rustSum > 0.05) audio.pan.pan.setTargetAtTime(Math.max(-0.8, Math.min(0.8, (rustX / rustSum) * 2 - 1)), at, 0.15);
        audio.master.gain.setTargetAtTime(vol(), at, 0.2);
      }

      // draw
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.disable(gl.DEPTH_TEST);
      gl.depthMask(false);
      gl.useProgram(sky);
      gl.uniform2f(SU.uRes, canvas.width, canvas.height);
      gl.uniform1f(SU.uHorizon, horizon);
      gl.uniform3fv(SU.uFog, FOG);
      gl.uniform3fv(SU.uSkyTop, SKYTOP);
      gl.uniform3fv(SU.uSunCol, SUNCOL);
      gl.bindVertexArray(skyVao);
      gl.drawArrays(gl.TRIANGLES, 0, 3);

      gl.enable(gl.DEPTH_TEST);
      gl.depthMask(true);
      gl.clear(gl.DEPTH_BUFFER_BIT);
      gl.useProgram(prog);
      gl.uniformMatrix4fv(U.uVP, false, VP);
      gl.uniform1f(U.uTime, time);
      gl.uniform1f(U.uFlutter, reduce ? 0.3 : 1);
      gl.uniform3fv(U.uEye, eye);
      gl.uniform3fv(U.uFog, FOG);
      gl.uniform3fv(U.uSkyTop, SKYTOP);
      gl.uniform3fv(U.uSun, SUN);
      gl.uniform3fv(U.uSunCol, SUNCOL);
      gl.uniform1f(U.uFogK, 1 - 0.45 * e);

      gl.bindVertexArray(groundVao);
      gl.vertexAttrib4f(4, 0, 0, 1, 1);
      gl.vertexAttrib4f(5, 1, 1, 1, 0);
      gl.vertexAttrib4f(6, 0, 0, 0, 0);
      gl.drawArrays(gl.TRIANGLES, 0, groundVerts);

      gl.bindVertexArray(treeVao);
      gl.bindBuffer(gl.ARRAY_BUFFER, bendBuf);
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, bend);
      gl.drawArraysInstanced(gl.TRIANGLES, 0, treeVerts, NT);
      gl.bindVertexArray(null);

      if (panels.length) updatePanels(VP, e);
      // tell the page we've arrived (after the panels are visible, so focus can move into them)
      if (arrived !== null) { const a = arrived; arrived = null; if (opts.onArrive) opts.onArrive(a); }
    };
    resize();
    raf = requestAnimationFrame(frame);

    // soft two-note chime for hovering the button
    const hoverSound = () => {
      if (!audio || !soundOn) return;
      const ctx = audio.ctx, at = ctx.currentTime;
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
      lp.connect(audio.master);
      [[659.25, 0, 0.07], [987.77, 0.07, 0.05]].forEach(([f, delay, peak]) => {
        const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0, at + delay);
        g.gain.linearRampToValueAtTime(peak, at + delay + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, at + delay + 0.6);
        o.connect(g); g.connect(lp);
        o.start(at + delay); o.stop(at + delay + 0.65);
      });
    };

    return {
      supported: true,
      setSound,
      hoverSound,
      setLayout,
      go,
      gust,
      duck(on) { duckK = on ? 0.15 : 1; if (audio && soundOn) audio.master.gain.setTargetAtTime(vol(), audio.ctx.currentTime, 0.3); },
      stop() {
        cancelAnimationFrame(raf);
        root.removeEventListener('pointermove', onMove);
        root.removeEventListener('pointerleave', onLeave);
        root.removeEventListener('pointercancel', onLeave);
        if (audio) { try { audio.ctx.close(); } catch (e) { /* already closed */ } }
        const lose = gl.getExtension('WEBGL_lose_context');
        if (lose) lose.loseContext();
      }
    };
  }

  // ---------- page: home <-> jukebox ----------
  var hero = document.getElementById('hero');
  var intro = document.getElementById('intro');
  var stage = document.getElementById('stage');
  var cta = document.querySelector('.cta');
  var title = document.getElementById('title');
  var video = document.getElementById('video');
  var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var state = 'home';
  var anims = [];

  // split the title into letters so they can blow away one by one
  var letters = [];
  (function () {
    var text = title.textContent.trim();
    title.setAttribute('aria-label', text);
    title.textContent = '';
    text.split(' ').forEach(function (word, i) {
      if (i) title.appendChild(document.createTextNode(' '));
      var w = document.createElement('span');
      w.className = 'word'; w.setAttribute('aria-hidden', 'true');
      Array.from(word).forEach(function (c) {
        var s = document.createElement('span'); s.className = 'ch'; s.textContent = c;
        w.appendChild(s); letters.push(s);
      });
      title.appendChild(w);
    });
  })();

  opts.onArrive = function (where) {
    if (where === 1 && state === 'listen') {
      stage.inert = false;
      document.getElementById('track-title').focus({ preventScroll: true });
    }
    if (where === 0 && state === 'home') {
      intro.inert = false;
      cta.focus({ preventScroll: true });
    }
  };
  var forest = startForest(document.getElementById('forest'), opts);

  // where each panel ends up = the invisible layout grid; tell the forest so it can clear space
  function measure() {
    var h = hero.getBoundingClientRect();
    var list = Array.prototype.map.call(document.querySelectorAll('.layout [data-panel]'), function (slot) {
      var r = slot.getBoundingClientRect();
      return { el: document.getElementById('panel-' + slot.dataset.panel), rect: { x: r.left - h.left, y: r.top - h.top, w: r.width, h: r.height } };
    });
    forest.setLayout(list);
  }

  function blowAway(instant) {
    anims.forEach(function (a) { a.cancel(); });
    anims = [];
    letters.concat([cta]).forEach(function (el, i) {
      var far = 0.45 + Math.random() * 0.6;
      var frames = reduce ? [{ opacity: 1 }, { opacity: 0 }] : [
        { transform: 'translate(0px, 0px) rotate(0deg) scale(1)', opacity: 1, filter: 'blur(0px)' },
        { transform: 'translate(' + Math.round(window.innerWidth * far) + 'px, ' + Math.round(-40 - Math.random() * 220) + 'px) rotate(' +
                     Math.round(Math.random() * 140 - 40) + 'deg) scale(' + (0.4 + Math.random() * 0.4).toFixed(2) + ')', opacity: 0, filter: 'blur(8px)' }
      ];
      anims.push(el.animate(frames, {
        duration: instant ? 0 : (reduce ? 250 : 1000 + Math.random() * 400),
        delay: instant || reduce ? 0 : i * 38 + (el === cta ? 120 : 0),
        easing: 'cubic-bezier(.55,0,.8,.25)', fill: 'forwards'
      }));
    });
  }

  function goListen(push, instant) {
    if (state === 'listen') return;
    state = 'listen';
    if (push) history.pushState({ view: 'listen' }, '', '#listen');
    intro.inert = true;
    measure();
    blowAway(instant);
    if (!instant && !reduce) forest.gust();
    forest.go(1, { wait: instant || reduce ? 0 : 0.35, dur: reduce ? 0.0001 : undefined, instant: instant });
  }

  function goHome(instant) {
    if (state === 'home') return;
    state = 'home';
    stage.inert = true;
    if (!video.paused) video.pause();
    forest.go(0, { dur: reduce || instant ? 0.0001 : 2.0, instant: instant });
    var back = function () { anims.forEach(function (a) { a.reverse(); }); };
    if (instant || reduce) back(); else setTimeout(back, 1100);
  }

  if (forest.supported) {
    cta.addEventListener('click', function (e) { e.preventDefault(); goListen(true, false); });
    document.getElementById('back').addEventListener('click', function () {
      if (history.state && history.state.view === 'listen') history.back(); else goHome(false);
    });
    window.addEventListener('popstate', function () {
      if (location.hash === '#listen') goListen(false, false); else goHome(false);
    });
    new ResizeObserver(function () { measure(); }).observe(hero);
    measure();
    // links like index.html#listen or index.html?track=gmao_t2m open the jukebox straight away
    if (location.hash === '#listen' || new URLSearchParams(location.search).get('track')) goListen(false, true);
  }

  // turn the forest down while a track plays
  video.addEventListener('play', function () { forest.duck(true); });
  video.addEventListener('pause', function () { forest.duck(false); });

  var btn = document.getElementById('sound');
  btn.addEventListener('click', function () {
    var on = btn.getAttribute('aria-pressed') !== 'true';
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    btn.querySelector('span').textContent = on ? 'Sound on' : 'Sound off';
    forest.setSound(on);
  });
  cta.addEventListener('mouseenter', function () { forest.hoverSound(); });
})();
</script>
<!-- the jukebox logic (track list, video, captions, screen-reader announcements) -->
<script type="module" src="js/main.js"></script>
