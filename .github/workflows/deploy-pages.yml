name: Deploy website to GitHub Pages

on:
  # Merging a pull request into main also triggers this push event.
  push:
    branches: [main]
    paths:
      - "website/**"
      - "jukebox/**"          # the Python code the "add your own" page runs in the browser
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      # website/py/jukebox.zip = the jukebox/ Python code, for the "add your own" page.
      # Rebuilt here so the site always runs the latest code, even if nobody ran
      # `py studio.py` / `py sonify.py` after changing it. (Plain Python, nothing to install.)
      - name: Pack the Python code for the browser
        run: python3 -m jukebox.webbundle

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
