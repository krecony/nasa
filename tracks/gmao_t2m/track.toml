# =============================================================================
#  Track: Near-Surface Temperature (GEOS-FP)
#  Build it:  py sonify.py gmao_t2m     (or use the studio: py studio.py)
#  The sound is set in sounds.toml (same folder).
# =============================================================================

# --- Shown on the website (and read by screen readers) -----------------------
title = "Near-Surface Temperature (GEOS-FP)"
source = "NASA GMAO GEOS-FP model, NASA Scientific Visualization Studio (SVS 5147)"
description = "A flat map of the whole Earth showing the air temperature 2 meters above the ground, hour by hour from 30 October to 14 November 2026, from NASA's GEOS-FP weather model. Colors run from dark blue, white and purple (-40 C) through blue, cyan, yellow, orange and red to dark red and grey (+40 C). The tropics stay warm and steady, deserts heat up every afternoon, and the Arctic, Siberia and northern Canada get colder as winter arrives."
listening_guide = [
  "Five held voices, one for each band of latitude, from the Arctic to Antarctica. Warmer = higher. Each step up or down is about 1 degree C.",
  "Listen to the Arctic voice sink as winter sets in, and the Antarctic voice rise with the southern spring.",
  "Plucks = places hotter than 30 C. Hotter = higher and louder.",
  "Every day the plucks sweep from right to left: afternoon heat moves west with the sun, from Asia to Africa to the Americas.",
  "Wind = how much of the Northern Hemisphere is below freezing. It grows as winter comes.",
  "A chime rings at the start of every day (midnight UTC).",
]

# --- The video ---------------------------------------------------------------
kind = "field"                     # "field" = a value everywhere on the map
video = "gmao_t2m_2048x1024.mp4"   # empty = the video file in this folder
start_time = "2026-10-30T09:00"    # first frame, in UTC
hours_per_frame = 1
slow_down = 1.5                    # play this many times slower
smooth_video = true                # blend frames so the slowed video isn't choppy
ignore = [  # boxes to ignore: [x0, y0, x1, y1] in video pixels
  [0, 0, 360, 80],
  [0, 920, 505, 1024],
]

# --- Words for the daily captions --------------------------------------------
caption_high = "Hottest"
caption_low = "Coldest outside Antarctica"
caption_share = "below freezing"
caption_share_name = "The frozen area"

# --- What the colors mean ----------------------------------------------------
units = "C"
max_color_distance = 40            # how close a pixel must be to a color bar color
hot_threshold = 30                 # high threshold (for the graph)
cold_threshold = 0                 # the captions give the share of the N. Hemisphere below this
very_cold_threshold = -20
colorbar = { image = "colorbar.png", min = -40, max = 40 } # the color bar image in this folder and what its ends mean
map = { lon_min = -180, lon_max = 180, lat_max = 90, lat_min = -90 } # flat world map filling the whole frame
