# =============================================================================
#  Earth Jukebox - sound settings for "Near-Surface Wind Speed (GEOS-FP)"
# =============================================================================
#
#  Run (fast, skips the video):
#     py sonify.py WindSpeed videos/YOUR_WIND_VIDEO.mp4 --no-video
#  and listen to output/WindSpeed/sonification.wav
#
#  This track uses the "field" engine (same as temperature), so the sections have
#  the same names as in gmao_t2m.toml. For wind they mean:
#     [choir]  5 held voices = average wind speed in 5 bands of latitude
#     [heat]   short sounds  = places with strong wind (above hot_threshold in the preset)
#     [frost]  background    = how windy the whole planet is
#     [chime]  once a day    = a new day (midnight UTC)
#
#  Samples used (put these files in samples/):
#     low-bottle-whistle-fx_D_major.wav            -> choir
#     wind-chimes-with-vibrato-2_69bpm_A_minor.wav -> heat (strong winds ring the chimes)
#     wind_C5.wav                                  -> frost (wind texture)
#     pad_Cmaj7.wav                                -> chime (daily chord)
#  Comment out (#) a `sample` line to go back to the built-in synth.
# =============================================================================


[music]
key = "C"                    # in C so it fits the C major 7 pad
scale = "major_pentatonic"   # C D E G A


[mix]
reverb_seconds = 2.8
reverb_wet = 0.3
peak = 0.89


# --- Choir: 5 breathy bottle whistles, one per band of latitude -------------------
# Arctic, northern mid-latitudes, tropics, southern mid-latitudes, Antarctic.
# Windier band = higher note. The strongest band is usually the "roaring forties"
# around Antarctica (southern mid-latitudes).
[choir]
enabled = true
volume = 0.26

sample = "samples/low-bottle-whistle-fx_D_major.wav"
root = "D3"                  # the whistle plays a D3
crossfade = 0.4              # seconds, smooths the loop (the whistle swells, so it "breathes")
# instrument = "pad"         # built-in alternative (delete the sample line to use it)
# harmonics = [1.0, 0.35, 0.15, 0.06]
# detune_cents = 6

lowest_note = "C3"           # note for `coldest` (here: calmest)...
highest_note = "C5"          # ...and for `warmest` (here: windiest)
coldest = 0                  # m/s  (the names come from the temperature track)
warmest = 15                 # m/s
degrees_per_step = 0.5       # every 0.5 m/s faster = one scale step higher
glide = 0.4
hysteresis = 0.3
smoothing = 5
pans = [-0.8, -0.4, 0.0, 0.4, 0.8]
band_volumes = [0.8, 1.0, 0.9, 1.0, 0.8]


# --- Heat = strong winds: wind chimes ring where the wind is above hot_threshold --------
# Stronger wind = higher and louder. West = left, east = right.
[heat]
enabled = true
volume = 0.3

sample = "samples/wind-chimes-with-vibrato-2_69bpm_A#_minor.wav"
root = "A6"                  # chimes don't have one clear note; A6 keeps them near their real pitch
pitched = true               # false = always play the chimes exactly as recorded
length = 1.5                 # seconds: only use the first strike of the recording
# instrument = "bell"        # built-in alternative

per_second_min = 0.5         # chimes per second when the strong-wind area is smallest...
per_second_max = 6           # ...and largest
lowest_note = "C6"           # at hot_from (slower, lower chimes)...
highest_note = "C7"          # ...at hot_to (bright chimes)
hot_from = 20                # m/s
hot_to = 35                  # m/s
pitch_jitter = 1
quiet = 0.4
loud = 1.0
stereo_width = 0.95


# --- Frost = how windy the planet is: a looped wind recording ------------------------
[frost]
enabled = true
volume = 0.3

sample = "samples/wind_C5.wav"   # looped for the whole track
measure = "mean"             # mean        = average wind speed over the whole globe
                             # hot_area    = share of the globe above hot_threshold (strong wind)
                             # freeze_area = share of the globe below cold_threshold (calm)
level_min = 0.3              # volume when the planet is least windy (0..1)
curve = 1.0                  # >1 = only loud at the windiest moments


# --- Chime = a new day: the C major 7 pad -----------------------------------------------
[chime]
enabled = true
volume = 0.18

sample = "samples/pad_Cmaj7.wav"
pitched = false              # play the chord as recorded (it's already in C)
note = "C4"
add_fifth = false            # the pad is already a full chord
